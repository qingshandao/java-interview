server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/product_tst_hmi?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:

  # mapper xml 文件位置
  mapper-locations: classpath:mappers/*.xml

  # 实体类别名
  type-aliases-package: com.gc.multithreaddemo.mybatis.entity

  # 开启驼峰命名
  configuration:
    map-underscore-to-camel-case: true

    # 输出 SQL 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# Actuator 监控线程池状态
# 开启所有 Actuator 端点
management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

